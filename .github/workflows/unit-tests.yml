# Runs the unit tests of the mod's pure logic (CastleStoryPlus.UnitTests) on every pull request and every push to main.
# They need no game: the logic they test is compiled straight from the Logic folders (docs/Testing.md).
# Not a required check (yet): a failing run shows on the pull request, branch protection does not wait for it.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CastleStoryPlus.UnitTests --nologo
